<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!--
    Suhbat ikonkasi — asosiy manba (veb, desktop, Android eski launcher'lar).
    Ko'k gradient (#3B82F6 atrofida), oq nutq pufagi va "S".
    Adaptive/iOS uchun qatlamlar: icon-background.svg + icon-foreground.svg (belgi bir xil).
    PNG/ICO/ICNS: `npm run icons` (scripts/gen-icons.mjs).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>
  <g transform="translate(54 54) scale(1.2) translate(-54 -53)">
    <path fill="#FFFFFF" d="M54 25c-15.5 0-28 11.9-28 26.6 0 6.4 2.4 12.3 6.4 16.9L29 80.5l13.4-4.6c3.5 1.5 7.4 2.3 11.6 2.3 15.5 0 28-11.9 28-26.6S69.5 25 54 25z"/>
    <path fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
          d="M63 41.5c-2.6-3-6.2-4.3-9.6-4.3-5 0-8.6 2.8-8.6 6.8 0 9.1 18.6 4.7 18.6 14.4 0 4.2-3.9 7.3-9.4 7.3-3.9 0-7.6-1.6-10-4.6"/>
  </g>
</svg>
