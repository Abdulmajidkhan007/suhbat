name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: suhbat
          POSTGRES_PASSWORD: suhbat
          POSTGRES_DB: suhbat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suhbat -d suhbat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://suhbat:suhbat@localhost:5432/suhbat
      JWT_SECRET: ci-only-not-a-secret
      # Desktop paketi bu job'da kerak emas (u alohida `desktop-package` job'ida).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test build
      # MinIO manbadan quriladi (rasm nashr qilinmaydi) — qatlamlar GitHub Actions keshida.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/minio
          load: true
          tags: suhbat-minio:local
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max
      - name: MinIO (S3-mos saqlash, docker compose)
        run: |
          docker compose up -d --no-build minio
          for i in $(seq 1 40); do
            curl -sf http://localhost:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker compose logs minio
          exit 1
      - name: API e2e (Postgres + MinIO)
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: suhbat
          S3_SECRET_KEY: suhbat-minio-secret
        run: |
          npm run db:deploy -w @suhbat/api
          npm run test:e2e -w @suhbat/api

  # Desktop: Linux'da qadoqlash (electron-builder --dir) tekshiriladi. macOS/Windows
  # build'lari faqat tag push qilinganda (`release-desktop.yml`).
  desktop-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://suhbat:suhbat@localhost:5432/suhbat
      - run: npx turbo run build --filter=@suhbat/desktop
      - name: Linux'da qadoqlash (unpacked)
        run: npm run package:dir -w @suhbat/desktop -- --linux
      - name: Qadoqda veb build'i va ishga tushadigan fayl bor
        run: |
          test -f apps/desktop/release/linux-unpacked/suhbat
          test -f apps/desktop/release/linux-unpacked/resources/web/index.html
          test -f apps/desktop/release/linux-unpacked/resources/app.asar
