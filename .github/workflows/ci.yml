name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: suhbat
          POSTGRES_PASSWORD: suhbat
          POSTGRES_DB: suhbat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suhbat -d suhbat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://suhbat:suhbat@localhost:5432/suhbat
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test build
      - name: API e2e (Postgres)
        run: |
          npm run db:deploy -w @suhbat/api
          npm run test:e2e -w @suhbat/api
