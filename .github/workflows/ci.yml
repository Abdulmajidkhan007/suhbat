name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

# Bir branch/PR'ga yangi push eski run'ni bekor qiladi (Actions daqiqalarini tejash); main'da — yo'q,
# har merge commit tekshirilsin.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: suhbat
          POSTGRES_PASSWORD: suhbat
          POSTGRES_DB: suhbat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suhbat -d suhbat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://suhbat:suhbat@localhost:5432/suhbat
      JWT_SECRET: ci-only-not-a-secret
      # Desktop paketi bu job'da kerak emas (u alohida `desktop-package` job'ida).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test build
      # release.yml dagi SUHBAT_API_URL tekshiruvi: to'g'ri qiymat o'tadi, sxemasizi yiqiladi.
      - name: API URL tekshiruv skripti
        run: |
          bash scripts/check-api-url.sh https://api.suhbat.uz
          for bad in "" "suhbatapi-production.up.railway.app" "https://" " https://api.suhbat.uz"; do
            if bash scripts/check-api-url.sh "$bad" > /dev/null; then echo "::error::'$bad' qabul qilinmasligi kerak edi"; exit 1; fi
          done
          if bash scripts/check-api-url.sh http://api.suhbat.uz SUHBAT_API_URL https-only > /dev/null; then exit 1; fi
      # release.yml: versiya tegdan, release matni CHANGELOG.md dan.
      - name: Release skriptlari
        run: |
          if bash scripts/release-version.sh 0.2 > /dev/null; then echo "::error::'0.2' qabul qilinmasligi kerak edi"; exit 1; fi
          bash scripts/release-version.sh v9.8.7
          for dir in apps/web apps/desktop apps/mobile; do
            test "$(node -p "require('./$dir/package.json').version")" = 9.8.7
          done
          git diff --stat -- apps
          git checkout -- apps/web/package.json apps/desktop/package.json apps/mobile/package.json
          # Oxirgi chiqarilgan teg uchun CHANGELOG bo'limi bo'lishi shart.
          latest="$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)"
          bash scripts/release-notes.sh "$latest" > /dev/null
          bash scripts/release-notes.sh v0.2.0 > /dev/null
          if bash scripts/release-notes.sh v99.0.0 > /dev/null; then echo "::error::bo'limsiz teg qabul qilinmasligi kerak edi"; exit 1; fi
      # MinIO manbadan quriladi (rasm nashr qilinmaydi) — qatlamlar GitHub Actions keshida.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/minio
          load: true
          tags: suhbat-minio:local
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max
      - name: MinIO (S3-mos saqlash, docker compose)
        run: |
          docker compose up -d --no-build minio
          for i in $(seq 1 40); do
            curl -sf http://localhost:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker compose logs minio
          exit 1
      - name: API e2e (Postgres + MinIO)
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: suhbat
          S3_SECRET_KEY: suhbat-minio-secret
        run: |
          npm run db:deploy -w @suhbat/api
          npm run test:e2e -w @suhbat/api

  # Desktop: Linux'da qadoqlash (electron-builder --dir) tekshiriladi. macOS/Windows
  # build'lari faqat tag push qilinganda (`release.yml`).
  desktop-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://suhbat:suhbat@localhost:5432/suhbat
      - run: npx turbo run build --filter=@suhbat/desktop
      - name: Linux'da qadoqlash (unpacked)
        run: npm run package:dir -w @suhbat/desktop -- --linux
      - name: Qadoqda veb build'i va ishga tushadigan fayl bor
        run: |
          test -f apps/desktop/release/linux-unpacked/suhbat
          test -f apps/desktop/release/linux-unpacked/resources/web/index.html
          test -f apps/desktop/release/linux-unpacked/resources/app.asar

  # Production image (Railway shu Dockerfile'ni quradi): quriladi, Postgres bilan ishga
  # tushadi (migratsiya + /health), non-root ekani tekshiriladi.
  api-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: suhbat
          POSTGRES_PASSWORD: suhbat
          POSTGRES_DB: suhbat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suhbat -d suhbat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: suhbat-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max
      - name: Non-root
        run: test "$(docker run --rm suhbat-api:ci id -u)" != "0"
      - name: Ishga tushirish (migratsiya, /health)
        run: |
          docker run -d --name api --network host \
            -e PORT=4100 \
            -e DATABASE_URL=postgresql://suhbat:suhbat@127.0.0.1:5432/suhbat \
            -e JWT_SECRET=ci-only-not-a-secret \
            suhbat-api:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4100/health | grep -q '"db":"up"'; then
              docker logs api 2>&1 | grep "have been applied"
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
      # Railway Volume root egaligida ulanadi (RAILWAY_RUN_UID=0): entrypoint papkani
      # `node` ga beradi va huquqni tushiradi; local media drayveri volume'ga yoza oladi.
      - name: Root + volume (local media)
        run: |
          docker volume create suhbat-media
          docker run -d --name api-root --network host --user 0 \
            -v suhbat-media:/data \
            -e PORT=4101 \
            -e RAILWAY_VOLUME_MOUNT_PATH=/data \
            -e DATABASE_URL=postgresql://suhbat:suhbat@127.0.0.1:5432/suhbat \
            -e JWT_SECRET=ci-only-not-a-secret \
            suhbat-api:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4101/health | grep -q '"db":"up"'; then break; fi
            sleep 1
          done
          docker logs api-root 2>&1 | tee /tmp/api-root.log
          grep -q "media saqlash: local" /tmp/api-root.log
          grep -q "media fayllari: /data/media" /tmp/api-root.log
          test "$(docker top api-root -eo user,args | grep 'dist/main.js' | grep -v grep | awk '{print $1}')" != "root"
          test "$(docker exec api-root stat -c %U /data/media)" = "node"

  # Veb production image (Railway shu Dockerfile'ni quradi): quriladi, non-root,
  # konteyner javob beradi, SPA fallback va assets keshi ishlaydi.
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: VITE_API_URL=https://api.ci.example
          load: true
          tags: suhbat-web:ci
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max
      - name: Non-root
        run: test "$(docker run --rm --entrypoint id suhbat-web:ci -u)" != "0"
      - name: Ishga tushirish ($PORT, SPA fallback, kesh)
        run: |
          docker run -d --name web -p 4200:4200 -e PORT=4200 suhbat-web:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4200/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4200/ | grep -q '<div id="root"'
          curl -sf http://127.0.0.1:4200/chat/abc | grep -q '<div id="root"'
          asset=$(curl -sf http://127.0.0.1:4200/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sfI "http://127.0.0.1:4200$asset" | grep -i 'cache-control: .*immutable'
          # API manzili bundle'ga qotgan
          curl -sf "http://127.0.0.1:4200$asset" | grep -q 'api.ci.example' || (docker logs web; exit 1)
