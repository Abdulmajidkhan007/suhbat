name: Release

# `v*` tegi push qilinganda yoki qo'lda (Actions → Release → Run workflow, `tag` kiritiladi):
# desktop (macOS dmg, Windows nsis) + Android APK GitHub Release'ga yuklanadi.
# Qo'lda ishga tushirilganda `main` dagi commit'ga shu nomli teg/release yaratiladi (docs/DEPLOY.md).
#
# Repo o'zgaruvchisi (Settings → Variables): SUHBAT_API_URL — shart, to'liq `https://...`
# ko'rinishida (veb/desktop/mobil build'iga qotadi; scripts/check-api-url.sh tekshiradi).
# Push secret'i (ixtiyoriy): GOOGLE_SERVICES_JSON — bo'lmasa APK push'siz.
# Android imzolash secret'lari (ixtiyoriy): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Hammasi bo'lmasa APK
# vaqtinchalik "debug" kaliti bilan imzolanadi va "sinov uchun" deb nomlanadi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tegi (masalan v0.1.0); main dagi commit'ga yaratiladi"
        required: true
        type: string

permissions:
  contents: read

env:
  # Teg nomi: push bo'lsa ref nomi, qo'lda ishga tushirilsa kiritilgan qiymat.
  TAG: ${{ inputs.tag || github.ref_name }}
  DATABASE_URL: postgresql://suhbat:suhbat@localhost:5432/suhbat

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Teg nomini tekshirish
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Teg nomi noto'g'ri: '$TAG' (kutilgan ko'rinish: v0.1.0)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          sparse-checkout: |
            CHANGELOG.md
            scripts
          sparse-checkout-cone-mode: false
      # Release matni CHANGELOG.md dan: `## vX.Y.Z` bo'limi bo'lmasa build boshlanmaydi.
      - name: CHANGELOG bo'limini tekshirish
        run: bash scripts/release-notes.sh "$TAG"

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
    runs-on: ${{ matrix.os }}
    env:
      # Veb build'iga kiradi: desktop ilova qaysi API'ga ulanishi.
      VITE_API_URL: ${{ vars.SUHBAT_API_URL }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # Qo'lda ishga tushirilganda doim main; push'da bo'sh = teg ko'rsatgan commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bo'sh yoki https:// siz qiymat ilovaga qotib "Tarmoq xatosi" berardi — build shu yerda yiqiladi.
      - name: SUHBAT_API_URL ni tekshirish
        shell: bash
        run: bash scripts/check-api-url.sh "$VITE_API_URL" SUHBAT_API_URL
      - run: npm ci
      # Fayl nomi (suhbat-X.Y.Z-…) va ilovadagi "Suhbat vX.Y.Z" tegdan olinadi.
      - name: Versiya tegdan
        shell: bash
        run: bash scripts/release-version.sh "$TAG"
      - run: npx turbo run build --filter=@suhbat/desktop
      - name: Qadoqlash
        run: npm run package -w @suhbat/desktop -- ${{ matrix.flag }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SUHBAT_API_URL: ${{ vars.SUHBAT_API_URL }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Push (FCM, ixtiyoriy): JSON yoki base64. Bo'lmasa push'siz build + ogohlantirish.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      # mobile.yml dagi kabi: RN + Firebase C++ build'i runner diskiga sig'masligi mumkin.
      - name: Diskda joy bo'shatish
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/PyPy" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
        with:
          # Qo'lda ishga tushirilganda doim main; push'da bo'sh = teg ko'rsatgan commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Android release'da cleartext HTTP o'chiq — faqat https:// qabul qilinadi.
      - name: SUHBAT_API_URL ni tekshirish
        run: bash scripts/check-api-url.sh "$SUHBAT_API_URL" SUHBAT_API_URL https-only
      # Gradle (`app/build.gradle`) GOOGLE_SERVICES_JSON env'idan `app/google-services.json` ni yozadi.
      - name: Push (FCM) konfiguratsiyasi
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON bor — APK push bildirishnomalar bilan quriladi"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret'i yo'q — APK push bildirishnomalarsiz quriladi (docs/QADAMLAR-TAFSILOT.md, Firebase)"
          fi
      - run: npm ci
      - name: Versiya tegdan
        run: bash scripts/release-version.sh "$TAG"
      - run: npx turbo run build --filter=@suhbat/mobile^...
      - name: Imzolash kaliti
        id: sign
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Android imzolash secret'lari to'liq emas — APK vaqtinchalik debug kaliti bilan imzolanadi (faqat sinov uchun)"
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Release APK (JS bundle Hermes bilan ichida)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=3 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: APK imzosi va nomi
        env:
          MODE: ${{ steps.sign.outputs.mode }}
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          bash scripts/verify-apk.sh "$apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" verify --verbose "$apk" | head -5
          mkdir -p out
          if [ "$MODE" = "release" ]; then
            cp "$apk" "out/suhbat-$TAG.apk"
          else
            cp "$apk" "out/suhbat-$TAG-sinov-uchun-debug-imzo.apk"
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: out/*.apk

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Faqat CHANGELOG.md (release matni shu tegning bo'limidan olinadi).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          sparse-checkout: |
            CHANGELOG.md
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          # CHANGELOG.md dagi `## vX.Y.Z` bo'limi (check job tekshirgan) + o'rnatish eslatmalari.
          bash scripts/release-notes.sh "$TAG" > notes.md
          printf '\n---\n' >> notes.md
          cat >> notes.md <<'NOTES'
          - **Android:** `*.apk`. Fayl nomida `sinov-uchun-debug-imzo` bo'lsa — vaqtinchalik kalit bilan imzolangan, faqat sinov uchun (har safar boshqa kalit: eskisini o'chirib qayta o'rnatish kerak bo'lishi mumkin). Boshqa holda — egasining kaliti bilan imzolangan.
          - **Desktop:** macOS `dmg`, Windows `exe`. Imzosiz: macOS'da Gatekeeper, Windows'da SmartScreen ogohlantirishi chiqadi.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release allaqachon bor (masalan, GitHub UI'dan yaratilgan): fayllarni yuklab qo'yamiz.
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            # Matn ham CHANGELOG'dan yangilanadi (aks holda UI'dagi bo'sh/eski matn qolardi).
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            args=()
            # Teg hali yo'q bo'lsa (qo'lda ishga tushirish), main dagi commit'ga yaratiladi.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then args+=(--target main); fi
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "suhbat $TAG" \
              --notes-file notes.md "${args[@]}"
          fi
