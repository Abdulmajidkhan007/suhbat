# Railway "config as code" — TURN xizmati. Xizmat sozlamalarida: Root Directory — bo'sh,
# Config file path — /infra/turn/railway.toml. Variables: TURN_MODE=railway, TURN_SECRET.
# Networking → TCP Proxy → port 3478 (Railway UDP bermaydi). README.md ga qarang.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/turn/Dockerfile"
watchPatterns = ["infra/turn/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
