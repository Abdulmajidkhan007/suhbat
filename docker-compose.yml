# Lokal ishlab chiqish uchun. Ishga tushirish: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: suhbat
      POSTGRES_PASSWORD: suhbat
      POSTGRES_DB: suhbat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suhbat -d suhbat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
