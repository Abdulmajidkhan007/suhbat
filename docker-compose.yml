# Lokal ishlab chiqish uchun. Ishga tushirish: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: suhbat
      POSTGRES_PASSWORD: suhbat
      POSTGRES_DB: suhbat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suhbat -d suhbat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-mos saqlash (media). Konsol: http://localhost:9001 (suhbat / suhbat-minio-secret).
  # Bucket'ni API o'zi yaratadi (`S3_BUCKET`). Faqat lokal ishlab chiqish uchun parol.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: suhbat
      MINIO_ROOT_PASSWORD: suhbat-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
