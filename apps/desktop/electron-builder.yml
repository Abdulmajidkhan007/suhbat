appId: uz.suhbat.desktop
productName: suhbat
copyright: suhbat
directories:
  output: release
  # Ikonkalar (scripts/gen-icons.mjs, manba assets/brand/icon.svg). `build/` .gitignore'da — shuning uchun `resources/`.
  buildResources: resources
files:
  - dist/main/**
  - dist/preload/**
  - package.json
# Veb build'i (apps/web/dist) ilova resurslariga nusxalanadi; `suhbat://app` shundan xizmat qiladi.
extraResources:
  - from: ../web/dist
    to: web
mac:
  icon: resources/icon.icns
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [x64, arm64]
  # Imzo/notarizatsiya sertifikatlari yo'q — imzosiz (REJA.md ga qarang).
  identity: null
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/icon.png
  # Faqat CI'da qadoqlashni tekshirish uchun (`--dir`); tarqatilmaydi.
  target: dir
  executableName: suhbat
  category: Network
publish: null
artifactName: suhbat-${version}-${os}-${arch}.${ext}
