apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def resolveNodeModule = { String pkg ->
    def dir = ["node", "--print", "require('path').dirname(require.resolve('${pkg}/package.json'))"]
        .execute(null, rootDir).text.trim()
    return file(dir)
}

react {
    // Monorepo: paketlar root `node_modules` da (hoist) — Node resolution bilan.
    root = file("../..")
    reactNativeDir = resolveNodeModule("react-native")
    codegenDir = resolveNodeModule("@react-native/codegen")
    cliFile = file("${resolveNodeModule("react-native")}/cli.js")
    // Release bundle'ni Hermes bytecode'ga kompilyatsiya qiluvchi (`%OS-BIN%` ni plagin almashtiradi).
    hermesCommand = "${resolveNodeModule("hermes-compiler")}/hermesc/%OS-BIN%/hermesc"

    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "uz.suhbat.app"
    defaultConfig {
        applicationId "uz.suhbat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release CI'da tegdan beriladi (.github/workflows/release.yml); lokal — standart.
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
    }
    // Debug — AGP standart `~/.android/debug.keystore` (avtomatik yaratiladi, repoda kalit yo'q).
    // Release: ANDROID_KEYSTORE_PATH (+ _PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) berilsa
    // imzolanadi (CI secret'idan), berilmasa imzosiz qoladi. Kalit repoda yo'q.
    def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Push (FCM): `google-services.json` repoda YO'Q (.gitignore). Lokal — faylni shu papkaga qo'ying;
// CI — `GOOGLE_SERVICES_JSON` env (JSON yoki base64) bo'lsa fayl yoziladi. Fayl bo'lmasa
// plagin qo'llanmaydi: build o'tadi, ilova push'siz ishlaydi (apps/mobile/README.md).
def googleServicesFile = file("google-services.json")
def googleServicesEnv = System.getenv("GOOGLE_SERVICES_JSON")?.trim()
if (!googleServicesFile.exists() && googleServicesEnv) {
    googleServicesFile.text = googleServicesEnv.startsWith("{")
        ? googleServicesEnv
        : new String(googleServicesEnv.decodeBase64(), "UTF-8")
}
if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("google-services.json yo'q — push bildirishnomalar o'chiq")
}
