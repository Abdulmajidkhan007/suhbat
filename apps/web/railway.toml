# Railway "config as code". Xizmat sozlamalarida: Root Directory — bo'sh (repo ildizi),
# Config-as-code path — /apps/web/railway.toml. Docker context — repo ildizi (monorepo).
# Variables: VITE_API_URL — API manzili (build vaqtida qotadi). Qadamlar: QADAMLAR.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
# Faqat veb yoki u bog'liq paketlar o'zgarganda qayta deploy.
watchPatterns = [
  "apps/web/**",
  "packages/core/**",
  "packages/client/**",
  "packages/ui-tokens/**",
  "package.json",
  "package-lock.json",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
