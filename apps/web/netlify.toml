# Netlify: "Base directory" = apps/web. Env: VITE_API_URL — API manzili (masalan https://api.suhbat.uz),
# build vaqtida qotadi. Qadamlar: docs/DEPLOY.md.
[build]
  command   = "npm run build --workspace=@suhbat/core && npm run build --workspace=@suhbat/client && npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
